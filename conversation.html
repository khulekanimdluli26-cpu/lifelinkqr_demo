<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLinkQR — Conversation</title><link rel="stylesheet" href="style.css"><style>.chat{max-width:850px;margin:auto}.messages{height:55vh;overflow:auto;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:18px}.message{display:flex;flex-direction:column;margin:10px 0;max-width:78%}.message.mine{margin-left:auto;align-items:flex-end}.bubble{padding:11px 14px;border-radius:14px;background:#e2e8f0}.mine .bubble{background:#1f2937;color:white}.message small{color:#64748b;font-size:11px;margin-top:4px}.composer{display:flex;gap:10px;margin-top:12px}.composer textarea{flex:1;min-height:55px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.empty-chat{text-align:center;color:#64748b;padding:40px}.error{color:#b91c1c}</style></head><body><header><div><h1>LifeLinkQR</h1><p>Secure Service Conversation</p></div><nav><a href="conversations.html">Messages</a></nav></header><main><section class="card chat"><h2 id="requestTitle">Conversation</h2><p id="requestMeta">Loading...</p><p id="chatStatus"></p><div id="messages" class="messages"></div><form id="messageForm" class="composer"><textarea id="messageText" maxlength="2000" required placeholder="Write a message..."></textarea><button id="sendBtn" type="submit">Send</button></form></section></main><script type="module" src="js/conversation.js"></script></body></html>
