
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>LifeLinkQR Firebase Test</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f2f5f8;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .box {

            width: 90%;

            max-width: 650px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.12);

        }

        h1 {

            margin-top: 0;

            color: #172033;

        }

        .status {

            padding: 20px;

            border-radius: 10px;

            background: #f1f3f5;

            white-space: pre-wrap;

            word-break: break-word;

            line-height: 1.6;

        }

    </style>

<link rel="stylesheet" href="style.css">
</head>


<body>


<div class="box">

    <h1>
        LifeLinkQR Firebase Test
    </h1>

    <p>
        Testing:
        <strong>
            profiles/LLQ-859AAE36
        </strong>
    </p>

    <div
        id="result"
        class="status">

        🔄 Connecting to Firebase...

    </div>

</div>


<script type="module">

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
        getFirestore,
        doc,
        getDoc
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* ==========================================
       FIREBASE
    ========================================== */

    const firebaseConfig = {

        apiKey:
            "AIzaSyAdujDCLQZgqsQubuE33EWeE3NN4c8-lss",

        authDomain:
            "lifelink-e3131.firebaseapp.com",

        projectId:
            "lifelink-e3131",

        storageBucket:
            "lifelink-e3131.firebasestorage.app",

        messagingSenderId:
            "466245505757",

        appId:
            "1:466245505757:web:4f59283a36a7fc7a5ac134",

        measurementId:
            "G-H6294GHB4W"

    };


    /* ==========================================
       INITIALIZE
    ========================================== */

    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    const result =
        document.getElementById(
            "result"
        );


    console.log(
        "Firebase initialized"
    );


    /* ==========================================
       WAIT FOR LOGIN
    ========================================== */

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                result.textContent =

                    "❌ NOT LOGGED IN\n\n" +

                    "Please login to LifeLinkQR " +
                    "first.";

                return;

            }


            result.textContent =

                "✅ AUTHENTICATION WORKING\n\n" +

                "Email:\n" +
                user.email +

                "\n\nUID:\n" +
                user.uid +

                "\n\n" +

                "🔄 Checking Firestore...";


            console.log(
                "Logged in:",
                user.email
            );


            /* ==================================
               FIRESTORE LOOKUP
            ================================== */

            try {

                const profileRef =
                    doc(
                        db,
                        "profiles",
                        "LLQ-859AAE36"
                    );


                console.log(
                    "Reading:",
                    "profiles/LLQ-859AAE36"
                );


                const snapshot =
                    await getDoc(
                        profileRef
                    );


                console.log(
                    "Document exists:",
                    snapshot.exists()
                );


                /* ==============================
                   PROFILE DOES NOT EXIST
                ============================== */

                if (
                    !snapshot.exists()
                ) {

                    result.textContent =

                        "⚠️ FIREBASE WORKS\n\n" +

                        "Authentication: ✅\n" +

                        "Firestore connection: ✅\n\n" +

                        "But this document does not exist:\n\n" +

                        "profiles/LLQ-859AAE36\n\n" +

                        "Create this document in Firestore.";

                    return;

                }


                /* ==============================
                   PROFILE EXISTS
                ============================== */

                const data =
                    snapshot.data();


                result.textContent =

                    "🎉 SUCCESS!\n\n" +

                    "Authentication: ✅\n" +

                    "Firestore: ✅\n" +

                    "Profile: ✅\n\n" +

                    "PROFILE DATA\n" +

                    "-------------------------\n\n" +

                    JSON.stringify(
                        data,
                        null,
                        2
                    );


            }

            catch(error) {

                console.error(
                    "Firestore error:",
                    error
                );


                result.textContent =

                    "❌ FIRESTORE ERROR\n\n" +

                    "Code:\n" +

                    error.code +

                    "\n\nMessage:\n" +

                    error.message;

            }

        }

    );

</script>


</body>

</html>
