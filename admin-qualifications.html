<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLinkQR — Qualification Review</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select{padding:11px;border:1px solid #ccc;border-radius:8px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:left}.badge{padding:4px 8px;border-radius:99px}.pending{background:#fff3cd}.verified{background:#d1e7dd}.rejected{background:#f8d7da}button{padding:9px 13px;border:0;border-radius:8px;cursor:pointer}.approve{background:#198754;color:#fff}.reject{background:#dc3545;color:#fff}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.card{background:#fff;max-width:650px;width:100%;border-radius:14px;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.item{background:#f7f7f7;padding:12px;border-radius:8px}.note{width:100%;padding:10px;box-sizing:border-box}</style></head><body><div class="wrap"><h1>🛡️ Qualification Review</h1><div class="toolbar"><input id="search" placeholder="Search professional or qualification"><select id="status"><option value="all">All</option><option value="pending">Pending</option><option value="verified">Verified</option><option value="rejected">Rejected</option></select><button id="refresh">Refresh</button></div><p id="msg">Checking administrator access...</p><div style="overflow:auto"><table class="table"><thead><tr><th>Professional</th><th>Qualification</th><th>Status</th><th>Submitted</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="modal" id="modal"><div class="card"><h2>Qualification Details</h2><div id="details"></div><textarea id="note" class="note" rows="3" placeholder="Verification note (optional)"></textarea><div style="display:flex;gap:10px;margin-top:12px"><button class="approve" id="verify">✓ Verify</button><button class="reject" id="reject">Reject</button><button id="close">Close</button></div></div></div><script type="module" src="js/admin-qualifications.js"></script></body></html>
