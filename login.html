<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LifeLinkQR - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<header>

    <div>

        <h1>LifeLinkQR</h1>

        <p>
            Secure profession-based information access
        </p>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>

</header>


<main>

    <section class="card">

        <h2>
            Login to LifeLinkQR
        </h2>

        <p>
            Enter your account details to continue.
        </p>


        <form id="loginForm">


            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >


            <br><br>


            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                required
            >


            <br><br>


            <button type="submit">

                Login

            </button>


        </form>


        <p id="message"></p>


        <p>

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </p>

    </section>

</main>


<script
    type="module"
    src="js/login.js">
</script>

</body>

</html>
