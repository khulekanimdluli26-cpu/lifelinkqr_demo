<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLinkQR — Marketplace Profile</title><link rel="stylesheet" href="style.css"><style>.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.field textarea{min-height:110px}.hint{color:#64748b;font-size:13px}</style></head><body><header><div><h1>LifeLinkQR</h1><p>Professional Marketplace Profile</p></div><nav><a href="professional-profile.html">Trust Profile</a><a href="dashboard.html">Dashboard</a></nav></header><main><section class="card"><h2>Publish My Professional Profile</h2><p class="hint">Only marketplace information is shown to customers. Do not put medical, criminal, academic records, ID numbers or private documents here.</p><form id="marketForm"><div class="field"><label>Bio</label><textarea id="bio" placeholder="Describe your services and experience"></textarea></div><div class="field"><label>Service Area</label><input id="serviceArea" placeholder="e.g. Richards Bay, Empangeni"></div><div class="field"><label>Starting Price (R)</label><input id="priceFrom" type="number" min="0"></div><div class="field"><label>Availability</label><input id="availability" placeholder="e.g. Mon-Fri, 08:00-17:00"></div><div class="field"><label>Marketplace Skills</label><input id="skills" placeholder="e.g. Wiring, Fault Finding, Installations"></div><button id="saveBtn" type="submit">Publish / Update Profile</button></form><p id="message"></p></section></main><script type="module" src="js/marketplace-profile.js"></script></body></html>
