<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLinkQR — My Skills</title><link rel="stylesheet" href="style.css"><style>body{background:#f6f8fb}.wrap{max-width:950px;margin:30px auto;padding:0 18px}.card2{background:#fff;padding:22px;border-radius:14px;margin:16px 0;box-shadow:0 4px 18px #00000012}label{display:block;font-weight:700;margin:10px 0 5px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}.primary{background:#111;color:#fff}.skill{border:1px solid #e5e7eb;padding:15px;border-radius:12px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.skill small{color:#64748b}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:700}.verified{background:#d1e7dd}.pending{background:#fff3cd}.rejected{background:#f8d7da}@media(max-width:650px){.skill{display:block}.skill button{margin-top:10px}}</style></head>
<body><div class="wrap"><p><a href="dashboard.html">← Dashboard</a></p><h1>🛠️ My Skills</h1><p>Add the skills you want customers to see on your professional profile.</p>
<div class="card2"><form id="form"><label>Skill</label><input id="skillName" required maxlength="80" placeholder="e.g. Electrical Installation"><label>Category</label><input id="category" maxlength="60" placeholder="e.g. Technical, Education, Healthcare"><label>Proficiency</label><select id="proficiency" required><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advanced">Advanced</option><option value="expert">Expert</option></select><br><br><button class="primary" id="submit" type="submit">Add Skill</button></form><p id="msg"></p></div>
<div class="card2"><h2>My Skills</h2><div id="list">Loading...</div></div></div><script type="module" src="js/skills.js"></script></body></html>
