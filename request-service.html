<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLinkQR — Request Service</title><link rel="stylesheet" href="style.css"><style>.form{max-width:700px;margin:auto}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.field textarea{min-height:120px}</style></head><body><header><div><h1>LifeLinkQR</h1><p>Request a Service</p></div><nav><a href="customer-dashboard.html">Dashboard</a></nav></header><main><section class="card form"><h2>Request a Quote / Service</h2><p id="professional">Loading professional...</p><form id="requestForm"><div class="field"><label>Service needed</label><input id="serviceTitle" required placeholder="e.g. Electrical repair"></div><div class="field"><label>Description</label><textarea id="description" required placeholder="Describe what you need..."></textarea></div><div class="field"><label>Service area / location</label><input id="location" required></div><div class="field"><label>Budget (optional)</label><input id="budget" placeholder="e.g. R1500"></div><div class="field"><label>Preferred date</label><input id="preferredDate" type="date"></div><button id="submitBtn" type="submit">Send Request</button></form><p id="message"></p></section></main><script type="module" src="js/request-service.js"></script></body></html>
