<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLinkQR — Qualifications</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:950px;margin:30px auto;padding:0 18px}.card2{background:#fff;padding:22px;border-radius:14px;margin:16px 0;box-shadow:0 4px 18px #00000012}label{display:block;font-weight:600;margin:10px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}.primary{background:#111;color:#fff}.doc{border:1px solid #eee;padding:14px;border-radius:10px;margin:10px 0}.badge{padding:4px 8px;border-radius:99px;background:#eee}.approved{background:#d1e7dd}.rejected{background:#f8d7da}.pending{background:#fff3cd}</style></head>
<body><div class="wrap"><h1>📄 My Qualifications</h1><p>Submit certificates or qualifications for administrator verification.</p>
<div class="card2"><form id="form"><label>Qualification / Certificate</label><input id="title" required placeholder="e.g. MBChB, Teaching Diploma"><label>Institution</label><input id="institution" required><label>Qualification Number</label><input id="number" placeholder="Optional"><label>Issue Date</label><input id="issueDate" type="date"><label>Expiry Date</label><input id="expiryDate" type="date"><label>Document reference (optional for now)</label><input id="fileName" placeholder="e.g. Teaching_Diploma.pdf"><br><br><button class="primary" id="submit" type="submit">Submit for Verification</button></form><p id="msg"></p></div>
<div class="card2"><h2>Submitted Documents</h2><div id="list">Loading...</div></div></div>
<script type="module" src="js/qualifications.js"></script></body></html>
