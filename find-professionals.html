<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLinkQR — Find Professionals</title><link rel="stylesheet" href="style.css"><style>.toolbar{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.toolbar input,.toolbar select{padding:12px;border:1px solid #cbd5e1;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}.pro{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:20px}.pro h3{margin-top:0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f7ee;color:#166534;font-size:12px;font-weight:800}.meta{color:#64748b;margin:7px 0}.pro button{margin-top:12px}@media(max-width:750px){.toolbar,.cards{grid-template-columns:1fr}}</style></head><body><header><div><h1>LifeLinkQR</h1><p>Professional Marketplace</p></div><nav><a href="customer-dashboard.html">Dashboard</a><a href="login.html">Login</a></nav></header><main><section class="card"><h2>🔎 Find a Professional</h2><p>Compare verified identity, profession, service area and starting price.</p><div class="toolbar"><input id="search" placeholder="Search name, skill or service"><select id="role"><option value="">All professions</option><option value="doctor">Doctor</option><option value="police">Police Officer</option><option value="educator">Educator</option><option value="civilian">Service Professional</option></select><input id="area" placeholder="Service area"></div></section><section id="results" class="cards"><div class="card">Loading professionals...</div></section></main><script type="module" src="js/find-professionals.js"></script></body></html>
